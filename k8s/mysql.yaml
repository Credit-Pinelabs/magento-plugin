---
# MySQL for Magento
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magento-db
  namespace: plural-uat
  labels:
    app: magento-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magento-db
  template:
    metadata:
      labels:
        app: magento-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magento-demo-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: magento
            - name: MYSQL_USER
              value: magento
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magento-demo-secrets
                  key: mysql-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1000m", memory: "2Gi" }
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: magento-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: magento-db-pvc
  namespace: plural-uat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: "20Gi" }
  storageClassName: gp2
---
apiVersion: v1
kind: Service
metadata:
  name: magento-db-svc
  namespace: plural-uat
spec:
  selector:
    app: magento-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306